<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#10b981"/>
  <!-- Space invader / alien pixel art style -->
  <g fill="white" transform="translate(15, 18) scale(0.7)">
    <!-- Top row - antennae -->
    <rect x="20" y="0" width="10" height="10"/>
    <rect x="70" y="0" width="10" height="10"/>
    <!-- Second row -->
    <rect x="30" y="10" width="10" height="10"/>
    <rect x="60" y="10" width="10" height="10"/>
    <!-- Third row - head top -->
    <rect x="20" y="20" width="60" height="10"/>
    <!-- Fourth row - head with eyes -->
    <rect x="10" y="30" width="80" height="10"/>
    <!-- Eyes (cut out as darker) -->
    <rect x="25" y="30" width="15" height="10" fill="#059669"/>
    <rect x="60" y="30" width="15" height="10" fill="#059669"/>
    <!-- Fifth row -->
    <rect x="10" y="40" width="80" height="10"/>
    <!-- Sixth row - narrower -->
    <rect x="20" y="50" width="60" height="10"/>
    <!-- Seventh row - body -->
    <rect x="30" y="60" width="10" height="10"/>
    <rect x="45" y="60" width="10" height="10"/>
    <rect x="60" y="60" width="10" height="10"/>
    <!-- Legs -->
    <rect x="20" y="70" width="10" height="10"/>
    <rect x="40" y="70" width="20" height="10"/>
    <rect x="70" y="70" width="10" height="10"/>
    <!-- Feet -->
    <rect x="10" y="80" width="10" height="10"/>
    <rect x="80" y="80" width="10" height="10"/>
  </g>
</svg>
